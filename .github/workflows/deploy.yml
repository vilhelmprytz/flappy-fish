name: Deploy

on:
  workflow_call:
    inputs:
      digest:
        required: true
        type: string
    secrets:
      TS_AUTHKEY:
        required: true
      ACME_EMAIL:
        required: true
      KUBECONFIG_B64:
        required: true
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest to deploy, e.g. sha256:abc123..."
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to the tailnet
        uses: tailscale/github-action@v4.1.3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Bootstrap cluster resources
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          CERT_MANAGER_VERSION: v1.21.2
        run: |
          set -euo pipefail
          : "${ACME_EMAIL:?secret not set}"
          # Install-if-absent, so a version bump never silently upgrades a live cluster.
          kubectl get deploy cert-manager-webhook -n cert-manager >/dev/null 2>&1 \
            || kubectl apply -f "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml"
          kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=5m
          sed "s|ACME_EMAIL|${ACME_EMAIL}|g" deploy/bootstrap/cluster-issuer.yaml | kubectl apply -f -

      - name: Deploy
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          helm upgrade --install flappy-fish ./flappy-fish \
            --namespace flappy-fish --create-namespace \
            --set image.digest="$DIGEST" \
            --wait --timeout 5m
