name: Deploy

on:
  workflow_call:
    inputs:
      digest:
        required: true
        type: string
      release:
        description: 'Helm release name.'
        required: false
        type: string
        default: flappy-fish
      namespace:
        description: 'Namespace to deploy into. Created if missing.'
        required: false
        type: string
        default: flappy-fish
      host:
        description: 'Ingress hostname. ORIGIN follows it.'
        required: false
        type: string
        default: flappy-fish.k8s.signed.zone
      environment:
        description: 'GitHub environment the deployment is recorded under.'
        required: false
        type: string
        default: production
      transient:
        description: >-
          Mark the environment ephemeral. Transient deployments are exempt from
          auto_inactive, so whoever sets this owns deactivating them.
        required: false
        type: boolean
        default: false
      bootstrap:
        description: >-
          Install cert-manager if absent and apply the ClusterIssuers.
        required: false
        type: boolean
        default: true
    secrets:
      TS_AUTHKEY:
        required: true
      ACME_EMAIL:
        required: false
      KUBECONFIG_B64:
        required: true
  workflow_dispatch:
    inputs:
      digest:
        description: 'Image digest to deploy, e.g. sha256:abc123...'
        required: true
        type: string
      release:
        required: false
        type: string
        default: flappy-fish
      namespace:
        required: false
        type: string
        default: flappy-fish
      host:
        required: false
        type: string
        default: flappy-fish.k8s.signed.zone
      environment:
        required: false
        type: string
        default: production
      transient:
        required: false
        type: boolean
        default: false
      bootstrap:
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-${{ inputs.namespace }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create the GitHub deployment
        id: deployment
        uses: actions/github-script@v9
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TRANSIENT: ${{ inputs.transient }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.REF,
              environment: process.env.ENVIRONMENT,
              transient_environment: process.env.TRANSIENT === 'true',
              description: `flappy-fish ${process.env.ENVIRONMENT}`,
              auto_merge: false,
              required_contexts: [],
            });
            return data.id;

      - name: Connect to the tailnet
        uses: tailscale/github-action@v4.1.3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Bootstrap cluster resources
        if: ${{ inputs.bootstrap }}
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          CERT_MANAGER_VERSION: v1.21.2
        run: |
          set -euo pipefail
          : "${ACME_EMAIL:?secret not set}"
          # Install-if-absent, so a version bump never silently upgrades a live cluster.
          kubectl get deploy cert-manager-webhook -n cert-manager >/dev/null 2>&1 \
            || kubectl apply -f "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml"
          kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=5m
          sed "s|ACME_EMAIL|${ACME_EMAIL}|g" deploy/bootstrap/cluster-issuer.yaml | kubectl apply -f -

      - name: Deploy
        env:
          DIGEST: ${{ inputs.digest }}
          RELEASE: ${{ inputs.release }}
          NAMESPACE: ${{ inputs.namespace }}
          HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          helm upgrade --install "$RELEASE" ./flappy-fish \
            --namespace "$NAMESPACE" --create-namespace \
            --set image.digest="$DIGEST" \
            --set ingress.host="$HOST" \
            --wait --timeout 5m

      - name: Report the deployment status
        if: ${{ always() && steps.deployment.outputs.result }}
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
          JOB_STATUS: ${{ job.status }}
          ENVIRONMENT_URL: https://${{ inputs.host }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: ok ? 'success' : 'failure',
              ...(ok ? { environment_url: process.env.ENVIRONMENT_URL } : {}),
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
