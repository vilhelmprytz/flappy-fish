# Default values for flappy-fish.

replicaCount: 1

image:
  repository: ghcr.io/vilhelmprytz/flappy-fish
  digest: ""
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Port adapter-node listens on. Passed to the container as PORT.
containerPort: 3000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: flappy-fish.k8s.signed.zone
  tls:
    enabled: true
    # Defaults to <fullname>-tls when left empty.
    secretName: ""

origin: https://flappy-fish.k8s.signed.zone

env: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
