apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flappy-fish.fullname" . }}
  labels:
    {{- include "flappy-fish.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flappy-fish.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flappy-fish.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "flappy-fish.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            # Both are read by adapter-node.
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: ORIGIN
              value: {{ .Values.origin | default (printf "https://%s" .Values.ingress.host) | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
